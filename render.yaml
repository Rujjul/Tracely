# API only. Neon is configured separately; no paid worker or Render database.
services:
  - type: web
    name: tracely-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh deploy/render/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
